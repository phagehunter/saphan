name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  content:
    name: Content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional checkers
        run: pip install check-jsonschema myanmar-tools
      - name: Full JSON Schema check
        run: check-jsonschema --schemafile content/schema/phrase.schema.json content/phrases/*/*.json
      - name: Project validator (Unicode, Zawgyi, status gates, provenance, audio)
        run: python -m tools.validate
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build content bundle
        run: python -m tools.build

  app:
    name: App build
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: python3 -m tools.build
      - run: pnpm run check
        working-directory: app
      - run: pnpm run build
        working-directory: app
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: app/build
